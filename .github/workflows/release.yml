name: Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: Artifact version label without a leading v
        required: true
        default: 0.0.0-ci

permissions:
  contents: read

env:
  VCPKG_COMMIT: d92484ed3c5020c6679d095ad3e5add907887b62
  VCPKG_BINARY_CACHE_VERSION: 1

jobs:
  linux-static:
    name: Linux musl static release
    runs-on: ubuntu-24.04
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - name: Prepare Linux release directories
        shell: bash
        run: mkdir -p out/vcpkg-diagnostics
      - name: Cache Alpine dependency downloads
        uses: actions/cache@v5
        with:
          path: |
            .vcpkg-downloads
          key: vcpkg-musl-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh', 'ci/release/install_alpine_static_xcb_deps.sh', 'ci/vcpkg-asset-download.sh') }}
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache-musl
          key: vcpkg-binaries-v${{ env.VCPKG_BINARY_CACHE_VERSION }}-linux-musl-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh', 'ci/release/install_alpine_static_xcb_deps.sh', 'ci/vcpkg-asset-download.sh') }}
      - name: Build and validate
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          docker run --rm \
            --env GITHUB_REF_NAME \
            --env GITHUB_SHA \
            --env RELEASE_VERSION \
            --env VCPKG_COMMIT \
            --env HOST_UID="$(id -u)" \
            --env HOST_GID="$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            alpine:3.22.5@sha256:7c8cb692ae09657cbc4a3f3cbd0e8d5a2690ba38386aaaf252dbb060bf5eb2e6 \
            sh -euxc '
              host_uid="${HOST_UID:-$(stat -c "%u" /workspace)}"
              host_gid="${HOST_GID:-$(stat -c "%g" /workspace)}"
              collect_linux_diagnostics() {
                status=$?
                if [ "$status" -ne 0 ]; then
                  diagnostics=/workspace/out/vcpkg-diagnostics
                  mkdir -p "$diagnostics"
                  if [ -d /workspace/.vcpkg-musl/buildtrees ]; then
                    find /workspace/.vcpkg-musl/buildtrees -type f \
                      \( -name "package-*-out.log" -o -name "package-*-err.log" \
                      -o -name "config-*.log" -o -name "*CMakeConfigureLog.yaml.log" \
                      -o -name "config.summary" -o -name "meson-log.txt" \) \
                      -print 2>/dev/null |
                    while IFS= read -r path; do
                      relative="${path#/workspace/.vcpkg-musl/buildtrees/}"
                      target="$diagnostics/buildtrees/$relative"
                      mkdir -p "$(dirname "$target")"
                      cp "$path" "$target" || true
                    done
                  fi
                  cp /workspace/out/build/linux-musl-static-gui/vcpkg-manifest-install.log \
                    "$diagnostics/vcpkg-manifest-install.log" 2>/dev/null || true
                fi
                if [ -d /workspace/out ]; then
                  chown -R "$host_uid:$host_gid" /workspace/out 2>/dev/null || true
                fi
                for cache_path in /workspace/.vcpkg-cache-musl /workspace/.vcpkg-downloads; do
                  if [ -d "$cache_path" ]; then
                    chown -R "$host_uid:$host_gid" "$cache_path" 2>/dev/null || true
                  fi
                done
                exit "$status"
              }
              trap collect_linux_diagnostics EXIT
              apk add --no-cache \
                autoconf autoconf-archive automake bash binutils bison build-base \
                ca-certificates cmake curl file flex fontconfig font-dejavu font-wqy-zenhei \
                gcompat gettext-dev gettext-static git gperf libtool linux-headers m4 meson ninja \
                perl pkgconf python3 tar unzip xz zip libx11-dev libx11-static libxau-dev \
                libxtst-dev libxtst-static libxrandr-dev libxcb-dev libxcb-static libxdmcp-dev \
                libxkbcommon-dev libxkbcommon-static xcb-util-cursor-dev xcb-util-dev \
                xcb-util-image-dev xcb-util-keysyms-dev xcb-util-renderutil-dev xcb-util-wm-dev \
                xorgproto xvfb-run
              git config --global --add safe.directory /workspace
              export VCPKG_ROOT=/workspace/.vcpkg-musl
              export VCPKG_DOWNLOADS=/workspace/.vcpkg-downloads
              export VCPKG_BINARY_SOURCES="clear;files,/workspace/.vcpkg-cache-musl,readwrite"
              export X_VCPKG_ASSET_SOURCES="clear;x-script,/workspace/ci/vcpkg-asset-download.sh {url} {sha512} {dst}"
              mkdir -p "$VCPKG_DOWNLOADS" /workspace/.vcpkg-cache-musl
              ci/release/install_alpine_static_xcb_deps.sh
              export CMAKE_LIBRARY_PATH="/usr/local/lib${CMAKE_LIBRARY_PATH:+:$CMAKE_LIBRARY_PATH}"
              git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
              git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
              git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
              ci/patch-vcpkg-qtbase-glib.sh "$VCPKG_ROOT"
              "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics -musl
              release_version="${RELEASE_VERSION#v}"
              export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
              cmake --preset linux-musl-static-gui -DTORRENTCRAFT_BUILD_DATE="$release_version"
              cmake --build --preset linux-musl-static-gui
              mkdir -p out
              xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                ctest --preset linux-musl-static-gui \
                --output-junit /workspace/out/test-linux-musl-static-gui.xml \
                --output-on-failure
              python3 ci/release/summarize_junit.py \
                --output out/phase8-test-summary.json \
                --source-commit "$GITHUB_SHA" \
                out/test-linux-musl-static-gui.xml
              mkdir -p out/release/linux
              python3 ci/release/static_release.py \
                --build-dir out/build/linux-musl-static-gui \
                --output-dir out/release/linux \
                --vcpkg-root "$VCPKG_ROOT" \
                --version "$release_version" \
                --triplet x64-linux-musl-static \
                --platform linux-musl-x86_64 \
                --include-source
              xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" \
                python3 ci/release/check_static_release.py \
                --directory out/release/linux \
                --platform linux-musl-x86_64 \
                --include-source \
                --version "$release_version"
              (cd out/release/linux && sha256sum -c SHA256SUMS)
            '
      - name: Collect Linux release diagnostics
        if: failure()
        shell: bash
        run: |
          mkdir -p out/vcpkg-diagnostics
          cp out/build/linux-musl-static-gui/vcpkg-manifest-install.log out/vcpkg-diagnostics/ 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: linux-static-release
          path: |
            out/release/linux
            out/phase8-test-summary.json
            out/test-linux-musl-static-gui.xml
            out/vcpkg-diagnostics
          if-no-files-found: warn

  windows-static:
    name: Windows static release
    runs-on: windows-2022
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache-windows,readwrite'
    steps:
      - uses: actions/checkout@v5
      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: .vcpkg-downloads
          key: vcpkg-windows-release-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh') }}
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache-windows
          key: vcpkg-binaries-v${{ env.VCPKG_BINARY_CACHE_VERSION }}-windows-msvc-static-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh') }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare vcpkg
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
          VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/.vcpkg-cache-windows" | Out-Null
          if (Test-Path -LiteralPath $env:VCPKG_ROOT) {
            Remove-Item -LiteralPath $env:VCPKG_ROOT -Recurse -Force
          }
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure and build
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
          VCPKG_DOWNLOADS: ${{ github.workspace }}\.vcpkg-downloads
        run: |
          cmake --preset windows-msvc-static-gui
          cmake --build --preset windows-msvc-static-gui --config Release
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $junitReport = Join-Path $env:GITHUB_WORKSPACE 'out\test-windows-msvc-static-gui.xml'
          $previousErrorActionPreference = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          ctest --preset windows-msvc-static-gui --output-junit $junitReport --output-on-failure
          $ctestExitCode = $LASTEXITCODE
          $ErrorActionPreference = $previousErrorActionPreference
          if (-not (Test-Path -LiteralPath $junitReport)) {
            throw "ctest did not produce JUnit report: $junitReport (exit code $ctestExitCode)"
          }
          python ci/release/summarize_junit.py --output out\phase8-test-summary.json --source-commit $env:GITHUB_SHA $junitReport
          $summaryExitCode = $LASTEXITCODE
          if ($summaryExitCode -ne 0) {
            exit $summaryExitCode
          }
          if ($ctestExitCode -ne 0) {
            exit $ctestExitCode
          }
      - name: Prepare MSVC inspection tools
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw "vswhere.exe was not found" }
          $dumpbin = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if (-not $dumpbin) { throw "dumpbin.exe was not found in the selected Visual Studio installation" }
          Split-Path -Parent $dumpbin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package and validate
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
        run: |
          $version = $env:RELEASE_VERSION
          if ($version.StartsWith('v')) { $version = $version.Substring(1) }
          New-Item -ItemType Directory -Force -Path out\release\windows | Out-Null
          python ci/release/static_release.py --build-dir out\build\windows-msvc-static-gui --output-dir out\release\windows --vcpkg-root $env:VCPKG_ROOT --version $version --triplet x64-windows-static --platform windows-x86_64 --config Release --include-source
          python ci/release/check_static_release.py --directory out\release\windows --platform windows-x86_64 --include-source --version $version
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-static-release
          path: |
            out/release/windows
            out\phase8-test-summary.json
            out/test-windows-msvc-static-gui.xml
          if-no-files-found: warn

  publish:
    name: Publish GitHub release
    needs: [linux-static, windows-static]
    if: startsWith(github.ref, 'refs/tags/v') && needs.linux-static.result == 'success' && needs.windows-static.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: linux-static-release
          path: out/release/linux
      - uses: actions/download-artifact@v7
        with:
          name: windows-static-release
          path: out/release/windows
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find out/release -type f -print0)
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "TorrentCraft ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            "${files[@]}"
