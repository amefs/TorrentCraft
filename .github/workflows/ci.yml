name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  VCPKG_COMMIT: d92484ed3c5020c6679d095ad3e5add907887b62
  VCPKG_BINARY_CACHE_VERSION: 1
  VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
  VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads

jobs:
  format:
    name: clang-format-18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format-18
      - name: Check formatting
        run: |
          git ls-files -z '*.cpp' '*.hpp' |
            xargs -0 --no-run-if-empty clang-format-18 --dry-run --Werror
      - name: Check changed-file whitespace
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          else
            range="${{ github.event.before }}...${{ github.sha }}"
          fi
          git diff --check "$range" -- \
            ':(exclude)cmake/vcpkg-patches/qtbase-glib-static-linkage.patch' \
            ':(exclude)cmake/vcpkg-ports/libtorrent/cleanup-mmap-jobs-when-callback-throws.patch'
  semver-contract:
    name: semantic-version-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate semantic version
        run: python3 ci/check_semver.py
      - name: Test semantic version helper
        run: python3 -m unittest ci.test_check_semver


  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux Clang Debug
            os: ubuntu-24.04
            preset: linux-clang-debug
          - name: Linux GCC Release
            os: ubuntu-24.04
            preset: linux-gcc-release
          - name: Windows MSVC Release
            os: windows-2022
            preset: windows-msvc-release
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache/${{ matrix.preset }},readwrite'
    steps:
      - uses: actions/checkout@v5
      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh') }}
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache/${{ matrix.preset }}
          key: vcpkg-binaries-v${{ env.VCPKG_BINARY_CACHE_VERSION }}-${{ runner.os }}-${{ matrix.preset }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh') }}
      - name: Prepare vcpkg on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rm -rf "$VCPKG_ROOT"
          mkdir -p "$VCPKG_DOWNLOADS"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Prepare vcpkg on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath $env:VCPKG_ROOT) {
            Remove-Item -LiteralPath $env:VCPKG_ROOT -Recurse -Force
          }
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          git -C $env:VCPKG_ROOT fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $env:VCPKG_ROOT checkout $env:VCPKG_COMMIT
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  clang-tidy:
    name: clang-tidy-18
    runs-on: ubuntu-24.04
    env:
      VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}/.vcpkg-cache/linux-clang-debug,readwrite'
    steps:
      - uses: actions/checkout@v5
      - name: Install analyzer
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-18 clang-tidy-18 cmake ninja-build
      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh') }}
      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache/linux-clang-debug
          key: vcpkg-binaries-v${{ env.VCPKG_BINARY_CACHE_VERSION }}-${{ runner.os }}-linux-clang-debug-${{ env.VCPKG_COMMIT }}-${{ hashFiles('CMakePresets.json', 'vcpkg.json', 'cmake/vcpkg-ports/**', 'cmake/vcpkg-triplets/**', 'cmake/vcpkg-patches/**', 'ci/patch-vcpkg-qtbase-glib.sh') }}
      - name: Prepare vcpkg
        shell: bash
        run: |
          rm -rf "$VCPKG_ROOT"
          mkdir -p "$VCPKG_DOWNLOADS"
          git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin "$VCPKG_COMMIT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
      - name: Configure and build
        run: |
          cmake --preset linux-clang-debug
          cmake --build --preset linux-clang-debug
      - name: Analyze
        run: run-clang-tidy-18 -p out/build/linux-clang-debug -quiet
